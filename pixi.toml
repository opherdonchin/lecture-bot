[workspace]
name = "lecture-bot"
version = "0.1.0"
description = "Lecture-specific educational bot"
authors = ["Opher Donchin"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
pip = ">=24.0"

[pypi-dependencies]
fastapi = ">=0.115,<1"
uvicorn = { version = ">=0.30,<1", extras = ["standard"] }
sqlalchemy = ">=2.0,<3"
pydantic = ">=2.8,<3"
pydantic-settings = ">=2.4,<3"
python-dotenv = ">=1.0,<2"
openai = ">=1.40,<2"
pytest = ">=8.3,<9"
httpx = ">=0.27,<1"
python-pptx = ">=0.6.23,<2"
jinja2 = ">=3.1,<4"

[tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
dev-bg = "bash -lc 'nohup uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 > app.log 2>&1 < /dev/null & disown; echo Started app in background. Logs: app.log'"
test = "pytest -q"
init-db = "python scripts/init_db.py"
stop = "fuser -k 8000/tcp 2>/dev/null && echo 'App stopped.' || echo 'App is not running.'"
tunnel = "ngrok http 8000"
grade-moodle = "python scripts/grade_moodle.py"
service-start = "systemctl --user start lecture-bot"
service-stop = "systemctl --user stop lecture-bot"
service-status = "systemctl --user status lecture-bot --no-pager"
service-install = "systemctl --user daemon-reload && systemctl --user enable lecture-bot"
