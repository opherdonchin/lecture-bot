[workspace]
name = "lecture-bot"
version = "0.1.0"
description = "Lecture-specific educational bot"
authors = ["Opher Donchin"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
pip = ">=24.0"

[pypi-dependencies]
fastapi = ">=0.115,<1"
uvicorn = { version = ">=0.30,<1", extras = ["standard"] }
sqlalchemy = ">=2.0,<3"
pydantic = ">=2.8,<3"
pydantic-settings = ">=2.4,<3"
python-dotenv = ">=1.0,<2"
python-multipart = ">=0.0.9,<1"
openai = ">=1.40,<2"
pytest = ">=8.3,<9"
httpx = ">=0.27,<1"
python-pptx = ">=0.6.23,<2"
jinja2 = ">=3.1,<4"
langdetect = ">=1.0, <2"

[tasks]
system-dev-start = "systemctl --user start lecture-bot.service"
system-dev-stop = "systemctl --user stop lecture-bot.service"
system-dev-restart = "systemctl --user restart lecture-bot.service"
system-dev-status = "systemctl --user status lecture-bot.service --no-pager -l"
system-dev-logs = "journalctl --user -u lecture-bot.service -b --no-pager"
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --root-path /bot"
dev-bg = "bash -lc 'nohup uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --root-path /bot > app.log 2>&1 < /dev/null & disown; echo Started app in background. Logs: app.log'"
admin-dev = "uvicorn app.admin_main:app --reload --host 0.0.0.0 --port 8001 --root-path /bot-admin"
stats-dev = "bash -lc 'LECTURE_BOT_STUDENT_ROOT_PATH=/stats uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --root-path /stats'"
stats-admin-dev = "bash -lc 'LECTURE_BOT_ADMIN_ROOT_PATH=/stats-admin uvicorn app.admin_main:app --reload --host 0.0.0.0 --port 8001 --root-path /stats-admin'"
admin-stop = '''bash -lc '
pids=$(lsof -tiTCP:8001 -sTCP:LISTEN 2>/dev/null || true)

if [ -z "$pids" ]; then
  echo "Admin app is not running."
  exit 0
fi

kill $pids 2>/dev/null || true

for _ in $(seq 1 20); do
  if ! lsof -nP -iTCP:8001 -sTCP:LISTEN >/dev/null 2>&1; then
    echo "Admin app stopped."
    exit 0
  fi
  sleep 0.5
done

fuser -k 8001/tcp >/dev/null 2>&1 || true
sleep 0.5

if ! lsof -nP -iTCP:8001 -sTCP:LISTEN >/dev/null 2>&1; then
  echo "Admin app stopped."
  exit 0
fi

echo "Admin app may still be shutting down; port 8001 is still busy."
exit 1
''''
test = "pytest -q"
init-db = "python scripts/init_db.py"
stop = '''bash -lc '
pids=$(lsof -tiTCP:8000 -sTCP:LISTEN 2>/dev/null || true)

if [ -z "$pids" ]; then
  echo "App is not running."
  exit 0
fi

kill $pids 2>/dev/null || true

for _ in $(seq 1 20); do
  if ! lsof -nP -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1; then
    echo "App stopped."
    exit 0
  fi
  sleep 0.5
done

fuser -k 8000/tcp >/dev/null 2>&1 || true
sleep 0.5

if ! lsof -nP -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1; then
  echo "App stopped."
  exit 0
fi

echo "App may still be shutting down; port 8000 is still busy."
exit 1
''''
tunnel = "ngrok http 8000"
grade-moodle = "python scripts/grade_moodle.py"
